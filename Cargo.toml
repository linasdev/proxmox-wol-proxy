[package]
name = "proxmox-wol-proxy"
description = "Proxmox Wake-on-LAN proxy"
authors = ["Linas Nikiperavičius <linas@linasdev.com>"]
repository = "https://github.com/linasdev/proxmox-wol-proxy"
license = "MIT"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.33"
env_logger = "0.11.11"
url = "2.5.8"
macaddr = "1.0.1"
futures-util = "0.3.33"
serde_json = "1.0.151"
rustls-pemfile = "2.2.0"
tokio-util = "0.7.19"
chrono = "0.4.45"
actix-web = "4.14.1"
actix-settings = "0.9.0"
proxmox-client = "0.9.2"

[dependencies.tokio]
version = "1.53.1"
features = ["macros", "net", "rt-multi-thread"]

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.rustls]
version = "0.23.43"
default-features = false
features = ["aws-lc-rs"]

[dependencies.awc]
version = "3.8.2"
features = ["rustls-0_23-native-roots"]
