[package]
name = "proxmox-wol-proxy"
description = "Proxmox Wake-on-LAN proxy"
authors = ["Linas Nikiperavičius <linas@linasdev.com>"]
repository = "https://github.com/linasdev/proxmox-wol-proxy"
license = "MIT"
version = "0.1.0"
edition = "2024"

[dependencies]
config = "0.15.25"
log = "0.4.33"
env_logger = "0.11.11"
url = "2.5.8"
macaddr = "1.0.1"
sha2 = "0.11.0"
hex = "0.4.3"
futures-util = "0.3.33"
serde_json = "1.0.151"
rustls-pemfile = "2.2.0"
tokio-util = "0.7.19"
chrono = "0.4.45"
http-body-util = "0.1.5"
axum = {version="0.8.9", features = ["macros"]}

[dependencies.axum-server]
version = "0.8.0"
features = ["tls-rustls"]

[dependencies.reqwest]
version = "0.13.4"
features = ["rustls", "form", "stream"]

[dependencies.tokio]
version = "1.53.1"
features = ["macros", "net", "rt-multi-thread"]

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.rustls]
version = "0.23.43"
default-features = false
features = ["aws-lc-rs"]

[dependencies.rustls-webpki]
version = "0.103.14"
default-features = false
features = ["aws-lc-rs"]
